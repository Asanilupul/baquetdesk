<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <script>
        // Ignore browser-extension noise so it does not cover the app UI.
        function isExternalNoise(text, url) {
            const t = String(text || '');
            const u = String(url || '');
            return /chrome-extension:|moz-extension:|safari-extension:|M_ID|contentScript\.bundle|\/200\.js/i.test(t + ' ' + u);
        }
        function showAppErrorBanner(title, detail, top) {
            if (!document.body) return;
            const div = document.createElement('div');
            div.style.cssText = 'position:fixed;' + (top ? 'top:0;' : 'bottom:0;') + 'left:0;right:0;background:' + (top ? '#ef4444' : '#991b1b') + ';color:white;padding:16px 56px 16px 20px;z-index:99999;font-family:monospace;white-space:pre-wrap;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);';
            div.textContent = title + '\n' + detail;
            const close = document.createElement('button');
            close.type = 'button';
            close.textContent = 'x';
            close.setAttribute('aria-label', 'Dismiss');
            close.style.cssText = 'position:absolute;top:10px;right:14px;background:transparent;border:0;color:white;font-size:22px;cursor:pointer;line-height:1;';
            close.onclick = function () { div.remove(); };
            div.appendChild(close);
            document.body.appendChild(div);
        }
        window.onerror = function (msg, url, line, col, error) {
            if (isExternalNoise(msg, url) || isExternalNoise(error && error.stack, url)) return true;
            showAppErrorBanner('CRITICAL ERROR:', String(msg) + '\nLine: ' + line + ':' + col + '\n' + (error && error.stack ? error.stack : ''), true);
            return false;
        };
        window.addEventListener('unhandledrejection', function (e) {
            const reason = e && e.reason;
            const detail = reason ? (reason.message || reason.stack || String(reason)) : 'Unknown reason';
            if (isExternalNoise(detail, reason && reason.stack)) {
                if (e && typeof e.preventDefault === 'function') e.preventDefault();
                return;
            }
            showAppErrorBanner('PROMISE REJECTION:', detail, false);
        });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>BanquetDesk | Attendance & Catering Management</title>
    <link rel="icon" type="image/png" href="attendly.png">
    <link rel="shortcut icon" type="image/png" href="attendly.png">
    <link rel="apple-touch-icon" href="attendly.png">
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React for Browser Execution -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.460.0"></script>
    <!-- PDF / charts load after first paint -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        /* Lucide icons must inherit button color and stay visible */
        .lucide,
        span.inline-flex > svg {
            display: inline-block;
            vertical-align: middle;
            stroke: currentColor;
            fill: none;
        }

        .boot-splash {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .boot-splash-card {
            text-align: center;
        }
        .boot-splash-card h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.04em;
            margin: 0 0 8px;
        }
        .boot-splash-card p {
            margin: 0;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #94a3b8;
        }
        .boot-splash-spin {
            width: 36px;
            height: 36px;
            border: 4px solid #334155;
            border-top-color: #6366f1;
            border-radius: 50%;
            margin: 0 auto 18px;
            animation: bootspin 0.8s linear infinite;
        }
        @keyframes bootspin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 no-select">
    <div id="root">
        <div class="boot-splash">
            <div class="boot-splash-card">
                <div class="boot-splash-spin"></div>
                <h1>BanquetDesk</h1>
                <p>Starting application</p>
            </div>
        </div>
    </div>

    <!-- Combo tier pricing helpers (must load before app) -->
    <script src="/combo-pricing.js" defer></script>
    <!-- App source: resources/js/banquetdesk.app.js (rebuild with npm run build:app) -->
    <script src="/banquetdesk.app.js" defer></script>
</body>

</html>
